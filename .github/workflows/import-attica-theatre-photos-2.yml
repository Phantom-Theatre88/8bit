name: Import Attica theatre photos 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-attica-theatre-photos-2.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rights-checked Commons photos
        run: |
          mkdir -p assets/history/maps/attica
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/%CE%99%CE%BA%CE%AC%CF%81%CE%B9%CE%BF%CE%BD%2C_%CE%94%CE%B9%CF%8C%CE%BD%CF%85%CF%83%CE%BF%CF%82._%CE%9F_%CE%B8%CE%B5%CE%B1%CF%84%CF%81%CE%B9%CE%BA%CF%8C%CF%82_%CF%87%CF%8E%CF%81%CE%BF%CF%82-_%CE%BF%CF%81%CF%87%CE%AE%CF%83%CF%84%CF%81%CE%B1%2C_%CE%B2%CE%AC%CF%83%CE%B5%CE%B9%CF%82_%CE%BA%CE%B1%CE%B9_%CE%B8%CF%81%CF%8C%CE%BD%CE%BF%CE%B9_%CF%84%CF%89%CE%BD_%CE%B5%CF%80%CE%B9%CF%83%CE%AE%CE%BC%CF%89%CE%BD._4%CE%BF_%CE%B1%CE%B9%CF%8E%CE%BD%CE%B1_%CF%80.%CE%A7.%2C_%CE%9C%CE%B1%CF%81%CE%BC%CE%B1%CF%81%CF%8C_%CE%A0%CE%B5%CE%BD%CF%84%CE%B5%CE%BB%CE%B9%CE%BA%CF%8C._IMG_8795.jpg?width=960" -o assets/history/maps/attica/ikarion.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Rhamnous_theater_from_above.jpg?width=960" -o assets/history/maps/attica/rhamnous.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Trachones_ancient_theater_01.jpg?width=960" -o assets/history/maps/attica/euonymon.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Remains_of_the_ancient_Theatre_of_Zea_in_Piraeus_on_July_4%2C_2021.jpg?width=960" -o assets/history/maps/attica/zea.jpg
      - name: Append credits
        run: |
          cat >> assets/history/maps/attica/CREDITS.md <<'EOF'

          ## ikarion.jpg
          - 対象: Ancient Theatre of Dionysos in Ikarion, Attica
          - Author: Dion.Ikar
          - Date: 19 April 2019
          - License: CC BY-SA 4.0
          - Source: https://commons.wikimedia.org/wiki/File:%CE%99%CE%BA%CE%AC%CF%81%CE%B9%CE%BF%CE%BD%2C_%CE%94%CE%B9%CF%8C%CE%BD%CF%85%CF%83%CE%BF%CF%82._%CE%9F_%CE%B8%CE%B5%CE%B1%CF%84%CF%81%CE%B9%CE%BA%CF%8C%CF%82_%CF%87%CF%8E%CF%81%CE%BF%CF%82-_%CE%BF%CF%81%CF%87%CE%AE%CF%83%CF%84%CF%81%CE%B1%2C_%CE%B2%CE%AC%CF%83%CE%B5%CE%B9%CF%82_%CE%BA%CE%B1%CE%B9_%CE%B8%CF%81%CF%8C%CE%BD%CE%BF%CE%B9_%CF%84%CF%89%CE%BD_%CE%B5%CF%80%CE%B9%CF%83%CE%AE%CE%BC%CF%89%CE%BD._4%CE%BF_%CE%B1%CE%B9%CF%8E%CE%BD%CE%B1_%CF%80.%CE%A7.%2C_%CE%9C%CE%B1%CF%81%CE%BC%CE%B1%CF%81%CF%8C_%CE%A0%CE%B5%CE%BD%CF%84%CE%B5%CE%BB%CE%B9%CE%BA%CF%8C._IMG_8795.jpg

          ## rhamnous.jpg
          - 対象: Theatre of Rhamnous
          - Author: Andreas Kakaris
          - Date: 9 October 2020
          - License: CC BY-SA 4.0
          - Source: https://commons.wikimedia.org/wiki/File:Rhamnous_theater_from_above.jpg

          ## euonymon.jpg
          - 対象: Theatre of Euonymon (Trachones)
          - Author: Mark Landon
          - Date: 1992 (digitized 2021)
          - License: CC0 1.0
          - Source: https://commons.wikimedia.org/wiki/File:Trachones_ancient_theater_01.jpg

          ## zea.jpg
          - 対象: Theatre of Zea, Piraeus
          - Author: George E. Koronaios
          - Date: 4 July 2021
          - License: CC BY-SA 4.0
          - Source: https://commons.wikimedia.org/wiki/File:Remains_of_the_ancient_Theatre_of_Zea_in_Piraeus_on_July_4%2C_2021.jpg
          EOF
      - name: Commit imported files and remove workflow
        run: |
          rm -f .github/workflows/import-attica-theatre-photos-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history/maps/attica .github/workflows/import-attica-theatre-photos-2.yml
          git commit -m "Add more Attica theatre map photos"
          git push
