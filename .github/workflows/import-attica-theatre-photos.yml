name: Import Attica theatre photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-attica-theatre-photos.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download theatre photos from Wikimedia Commons
        run: |
          mkdir -p assets/history/maps/attica
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_Theatre_of_Dionysus_in_Athens_on_30_May_2021.jpg?width=960" -o assets/history/maps/attica/dionysus.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Thorikos_-_ancient_Greek_theatre_(48930569458).jpg?width=960" -o assets/history/maps/attica/thorikos.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Theatre_of_Amphiareion_in_Oropos_(%CE%98%CE%AD%CE%B1%CF%84%CF%81%CE%BF_%CE%91%CE%BC%CF%86%CE%B9%CE%AC%CF%81%CE%B5%CE%B9%CE%BF%CF%85_%CE%A9%CF%81%CF%89%CF%80%CE%BF%CF%8D).jpg?width=960" -o assets/history/maps/attica/amphiareion.jpg
      - name: Write credits
        run: |
          cat > assets/history/maps/attica/CREDITS.md <<'EOF'
          # アテネ周辺・劇場地図 写真クレジット

          ## dionysus.jpg
          - 対象: Theatre of Dionysus, Athens
          - Author: George E. Koronaios
          - Date: 30 May 2021
          - License: CC BY-SA 2.0
          - Source: https://commons.wikimedia.org/wiki/File:The_Theatre_of_Dionysus_in_Athens_on_30_May_2021.jpg

          ## thorikos.jpg
          - 対象: Theatre of Thorikos
          - Author: Rab Lawrence
          - Date: 20 October 2019
          - License: CC BY 2.0
          - Source: https://commons.wikimedia.org/wiki/File:Thorikos_-_ancient_Greek_theatre_(48930569458).jpg

          ## amphiareion.jpg
          - 対象: Theatre of Amphiareion in Oropos
          - Author: Γεώργιος Βέζας
          - Date: 20 May 2020
          - License: CC BY-SA 4.0
          - Source: https://commons.wikimedia.org/wiki/File:Theatre_of_Amphiareion_in_Oropos_(%CE%98%CE%AD%CE%B1%CF%84%CF%81%CE%BF_%CE%91%CE%BC%CF%86%CE%B9%CE%AC%CF%81%CE%B5%CE%B9%CE%BF%CF%85_%CE%A9%CF%81%CF%89%CF%80%CE%BF%CF%8D).jpg
          EOF
      - name: Commit imported files and remove workflow
        run: |
          rm -f .github/workflows/import-attica-theatre-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history/maps/attica .github/workflows/import-attica-theatre-photos.yml
          git commit -m "Add Attica theatre map photos"
          git push
