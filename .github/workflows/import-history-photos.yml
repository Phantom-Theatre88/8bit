name: Import History sunlight reference photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-history-photos.yml"

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download reference photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/history/sunlight
          curl -L --fail --retry 3 -o assets/history/sunlight/01_epidaurus_greek_theatre.jpg "https://upload.wikimedia.org/wikipedia/commons/5/5b/The_great_theater_of_Epidaurus%2C_designed_by_Polykleitos_the_Younger_in_the_4th_century_BC%2C_Sanctuary_of_Asklepeios_at_Epidaurus%2C_Greece_%2814015010416%29.jpg"
          curl -L --fail --retry 3 -o assets/history/sunlight/02_orange_roman_theatre.jpg "https://upload.wikimedia.org/wikipedia/commons/c/c2/Roman_Theatre_in_Orange_2008.jpg"
          curl -L --fail --retry 3 -o assets/history/sunlight/03_shakespeares_globe.jpg "https://upload.wikimedia.org/wikipedia/commons/0/0c/Shakespeare%27s_Globe_%2839593823381%29.jpg"
          curl -L --fail --retry 3 -o assets/history/sunlight/04_itsukushima_noh_stage.jpg "https://upload.wikimedia.org/wikipedia/commons/e/ee/ItsukushimaNobutai7442.jpg"

      - name: Write source and license notes
        shell: bash
        run: |
          cat > assets/history/sunlight/CREDITS.md <<'EOF'
          # 太陽光 History 写真クレジット

          ## 01_epidaurus_greek_theatre.jpg
          - 対象: Ancient Theatre of Epidaurus（古代ギリシャ劇場）
          - Author: Carole Raddato / Following Hadrian
          - License: CC BY-SA 2.0
          - Source: https://commons.wikimedia.org/wiki/File:The_great_theater_of_Epidaurus,_designed_by_Polykleitos_the_Younger_in_the_4th_century_BC,_Sanctuary_of_Asklepeios_at_Epidaurus,_Greece_(14015010416).jpg

          ## 02_orange_roman_theatre.jpg
          - 対象: Roman Theatre of Orange（古代ローマ劇場）
          - Source: https://commons.wikimedia.org/wiki/File:Roman_Theatre_in_Orange_2008.jpg
          - 利用時は上記Commonsページ記載の作者・ライセンス表記を画面クレジットへ反映すること。

          ## 03_shakespeares_globe.jpg
          - 対象: Shakespeare's Globe（現代の復元劇場）
          - Author: Daniel (daniel0685)
          - License: CC BY 2.0
          - Source: https://commons.wikimedia.org/wiki/File:Shakespeare%27s_Globe_(39593823381).jpg
          - Note: 16〜17世紀当時の写真ではなく、現代の復元Globe。

          ## 04_itsukushima_noh_stage.jpg
          - 対象: 厳島神社 能舞台
          - Author: Fg2
          - License: Public Domain
          - Source: https://commons.wikimedia.org/wiki/File:ItsukushimaNobutai7442.jpg

          ## 運用
          - History画面に実装する際は、各写真の出典・作者・ライセンス条件を表示または参照可能にする。
          - トリミング・加工を行った場合は、ライセンス条件に応じて改変の明示を行う。
          EOF

      - name: Commit imported assets
        shell: bash
        run: |
          rm -f .github/workflows/import-history-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history/sunlight .github/workflows/import-history-photos.yml
          git commit -m "Add History sunlight theatre reference photos"
          git push
