name: Import west Turkey theatre photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-west-turkey-theatre-photos.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rights-checked Commons photos
        run: |
          mkdir -p assets/history/maps/west-turkey
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_Great_Theatre_in_Ephesus%2C_Turkey.jpg?width=960" -o assets/history/maps/west-turkey/ephesus.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Theater_of_Priene.jpg?width=960" -o assets/history/maps/west-turkey/priene.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Pergamon_Theater.JPG?width=960" -o assets/history/maps/west-turkey/pergamon.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Assos_Theatre_012.jpg?width=960" -o assets/history/maps/west-turkey/assos.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Miletus_Ancient_Theater.jpg?width=960" -o assets/history/maps/west-turkey/miletus.jpg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Aphrodisias_Theatre_General_view_4398.jpg?width=960" -o assets/history/maps/west-turkey/aphrodisias.jpg
      - name: Write credits
        run: |
          cat > assets/history/maps/west-turkey/CREDITS.md <<'EOF'
          # 現在のトルコ西部・劇場地図 写真クレジット

          ## ephesus.jpg
          - 対象: Great Theatre of Ephesus
          - Author: Dennis G. Jarvis
          - License: CC BY-SA 2.0
          - Source: https://commons.wikimedia.org/wiki/File:The_Great_Theatre_in_Ephesus,_Turkey.jpg

          ## priene.jpg
          - 対象: Theatre of Priene
          - Author: Ken and Nyetta
          - License: CC BY 2.0
          - Source: https://commons.wikimedia.org/wiki/File:Theater_of_Priene.jpg

          ## pergamon.jpg
          - 対象: Theatre of Pergamon
          - Author: Elelicht
          - License: CC BY-SA 3.0
          - Source: https://commons.wikimedia.org/wiki/File:Pergamon_Theater.JPG

          ## assos.jpg
          - 対象: Theatre of Assos
          - Author: Dosseman
          - License: CC BY-SA 4.0
          - Source: https://commons.wikimedia.org/wiki/File:Assos_Theatre_012.jpg

          ## miletus.jpg
          - 対象: Theatre of Miletus
          - Author: Hamed k13
          - License: CC BY-SA 4.0
          - Source: https://commons.wikimedia.org/wiki/File:Miletus_Ancient_Theater.jpg

          ## aphrodisias.jpg
          - 対象: Theatre of Aphrodisias
          - Author: Dosseman
          - License: CC BY-SA 4.0
          - Source: https://commons.wikimedia.org/wiki/File:Aphrodisias_Theatre_General_view_4398.jpg
          EOF
      - name: Commit imported files and remove workflow
        run: |
          rm -f .github/workflows/import-west-turkey-theatre-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history/maps/west-turkey .github/workflows/import-west-turkey-theatre-photos.yml
          git commit -m "Add west Turkey theatre map photos"
          git push
