  el.style.transform="translate3d(0,"+y.toFixed(2)+"px,0) rotateX("+clamp(-d*6,-12,12).toFixed(2)+"deg)";

// Independent X/Y/Z swimming motion. No carousel, synchronized orbit, or fixed-position wobble.
const driftStates=new Map();let focusCard=null;

const depthSlots=[
 {x:.22,y:.39,z:1.05,a:1},{x:.52,y:.67,z:1.03,a:1},
 {x:.79,y:.38,z:1.04,a:1},{x:.46,y:.15,z:.70,a:.83},
 {x:.77,y:.78,z:.69,a:.80},{x:.27,y:.77,z:.67,a:.79},
 {x:.69,y:.16,z:.62,a:.76},{x:.34,y:.18,z:.61,a:.77},
 {x:.91,y:.60,z:.58,a:.73},{x:.12,y:.61,z:.55,a:.72},
 {x:.48,y:.13,z:.38,a:.52},{x:.89,y:.21,z:.36,a:.49},
 {x:.16,y:.19,z:.34,a:.48},{x:.69,y:.91,z:.32,a:.44},
 {x:.28,y:.90,z:.30,a:.42},{x:.95,y:.86,z:.27,a:.40},

function stateFor(id,i,count){
 if(driftStates.has(id))return driftStates.get(id);
 const seed=[...id].reduce((n,c)=>((n*33+c.charCodeAt(0))>>>0),17);
 const slot=i>=depthSlots.length?{x:.53+Math.sin(i*2.39)*.17,y:.12+Math.cos(i*1.79)*.10,z:.14,a:.075}:depthSlots[i];
 const st={x:slot.x,y:slot.y,z:slot.z,a:slot.a,seed,
  driftX:.008+(seed%7)*.0015,driftY:.007+((seed>>>4)%7)*.001,
  phase:(seed%628)/100};

}
function depthAt(rank,count){
 const n=depthSlots.length;
 if(rank>=n){
  const a=(rank-n)/Math.max(1,count-n);
  return {x:.52+Math.sin(a*Math.PI*1.6)*.16,y:.13+Math.cos(a*Math.PI*1.6)*.06,z:.12,a:.045};
 }

function frame(t){
 const dt=Math.min(.06,Math.max(.001,(t-last)/1000));last=t;
 const w=stage.clientWidth,h=stage.clientHeight;
 const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const selected=fixtures.filter(f=>cardByKey.has(f.id)&&(theme<0||f.theme===theme)).sort((a,b)=>Number(Boolean(b.data.image))-Number(Boolean(a.data.image))).map(f=>f.id);
 const others=fixtures.filter(f=>cardByKey.has(f.id)&&theme>=0&&f.theme!==theme).map(f=>f.id);
 const order=selected.concat(others);

    x:a.x+(b.x-a.x)*blend,y:a.y+(b.y-a.y)*blend,
