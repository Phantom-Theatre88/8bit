(()=>{"use strict";const names=["用語","人物・職業","機構・技術","光源・照明","劇場建築","劇場・遺跡","作品・上演","社会・制度","文化・思想"],labels=["太陽光","松明","かがり火","蝋燭","油灯","劇場","舞台装置","仮面","祭礼","上演","建築","照明"],emoji=["☀️","🔥","🔥","🕯️","🏺","🏛️","⚙️","🎭","🎪","🎟️","🏗️","💡"];const stage=document.getElementById("stage"),themeBox=document.getElementById("themes"),counter=document.getElementById("counter"),title=document.getElementById("detailTitle"),desc=document.getElementById("detailText");let theme=3,rotation=0,target=0,drag=null,last=performance.now(),lastMoved=0;document.documentElement.style.setProperty('--panel-height','38%');document.querySelectorAll('[data-ratio]').forEach(b=>b.addEventListener('click',()=>{document.documentElement.style.setProperty('--panel-height',b.dataset.ratio+'%');document.querySelectorAll('[data-ratio]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));const N=12,cards=[];let themePos=3,themeTarget=3,themeDrag=null,themeMovedAt=0,themeWheelLock=0;

names.forEach((n,i)=>{const b=document.createElement("button");b.type="button";b.className="theme";b.innerHTML='<span class="theme-art"></span><span class="theme-symbol" aria-hidden="true">'+["📖","🎭","⚙️","☀️","🏛️","🏟️","🎟️","⚖️","💭"][i]+'</span><span class="theme-name">'+n+'</span><span class="flap-top"></span><span class="flap-bottom"></span>';b.addEventListener("click",()=>{if(performance.now()-themeMovedAt<280)return;setTheme(i)});themeBox.appendChild(b)});
