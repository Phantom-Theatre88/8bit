<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-label="StageLight">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a00" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ff9a00" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff9a00" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- locked side-view fixture: 90° profile -->
  <g fill="none" stroke="#f3f4f6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M18 13h13v30"/>
    <path d="M31 13h18v30" opacity="0"/>
    <path d="M18 43v-7c0-3 2-5 5-5h12"/>
    <circle cx="24" cy="42" r="4.3"/>
    <path d="M24 46v7h44V31H24"/>
    <path d="M68 31h13v22H68"/>
    <path d="M81 34h8v16h-8"/>
    <path d="M14 35v18h10"/>
    <path d="M12 37v14"/>
  </g>

  <!-- straight beam on fixture centerline -->
  <path d="M89 36 L232 25 L232 59 L89 48 Z" fill="url(#beam)"/>
  <line x1="89" y1="42" x2="245" y2="42" stroke="#ffd08a" stroke-width="1" opacity="0.55"/>

  <!-- 8bit black cutout -->
  <text x="132" y="49" fill="#050505" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="900" letter-spacing="-2">8bit</text>

  <!-- digital fade-out -->
  <g fill="#ff9a00">
    <rect x="229" y="26" width="6" height="6" opacity=".95"/><rect x="237" y="24" width="5" height="5" opacity=".9"/><rect x="245" y="28" width="5" height="5" opacity=".85"/>
    <rect x="233" y="35" width="5" height="5" opacity=".9"/><rect x="241" y="36" width="4" height="4" opacity=".78"/><rect x="250" y="34" width="4" height="4" opacity=".65"/>
    <rect x="229" y="46" width="6" height="6" opacity=".92"/><rect x="238" y="47" width="5" height="5" opacity=".82"/><rect x="247" y="45" width="4" height="4" opacity=".7"/>
    <rect x="257" y="28" width="4" height="4" opacity=".55"/><rect x="263" y="39" width="3" height="3" opacity=".45"/><rect x="257" y="50" width="3" height="3" opacity=".4"/>
    <rect x="270" y="33" width="3" height="3" opacity=".3"/><rect x="274" y="46" width="2.5" height="2.5" opacity=".25"/>
  </g>

  <!-- locked StageLight wordmark -->
  <text x="14" y="86" fill="#f7f7f7" font-family="Sora, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="500" letter-spacing=".2">StageLight</text>
</svg>