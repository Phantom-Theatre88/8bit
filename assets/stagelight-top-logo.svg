<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-label="StageLight 8bit">
  <rect width="360" height="96" fill="none"/>

  <!-- Fixture: exact side profile, top row -->
  <g transform="translate(8 7) scale(.78)" fill="#050505" stroke="#f4f4f4" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M10 28h15v38H10c-4 0-7-4-7-9V37c0-5 3-9 7-9Z"/>
    <rect x="25" y="28" width="52" height="38" rx="1"/>
    <path d="M26 6h14v48a7 7 0 0 1-14 0Z"/>
    <circle cx="33" cy="53" r="5" fill="#050505"/>
    <path d="M77 29h13l5 4v28l-5 4H77Z"/>
    <path d="M83 29c-5 11-5 25 0 36M90 32c-4 9-4 20 0 30" fill="none"/>
    <rect x="94" y="35" width="5" height="24" rx="1"/>
  </g>

  <!-- Horizontal beam from lens center -->
  <path d="M85 38 L288 21 L288 65 L85 48 Z" fill="#ff9300"/>
  <line x1="85" y1="43" x2="302" y2="43" stroke="#fff" stroke-width="1.2" opacity=".88"/>

  <!-- 8bit with thin white separation line -->
  <text x="170" y="55" fill="#050505" stroke="#fff" stroke-width="1.1" paint-order="stroke fill" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="40" font-weight="900" letter-spacing="-.8">8bit</text>

  <!-- Digital fade only at beam end -->
  <g fill="#ff9300">
    <rect x="282" y="21" width="8" height="8"/><rect x="292" y="18" width="6" height="6" opacity=".95"/><rect x="301" y="23" width="5" height="5" opacity=".88"/>
    <rect x="286" y="32" width="6" height="6"/><rect x="296" y="34" width="5" height="5" opacity=".85"/><rect x="307" y="31" width="4" height="4" opacity=".78"/>
    <rect x="283" y="44" width="7" height="7"/><rect x="294" y="45" width="5" height="5" opacity=".88"/><rect x="304" y="43" width="4" height="4" opacity=".72"/>
    <rect x="286" y="56" width="7" height="7"/><rect x="297" y="57" width="5" height="5" opacity=".82"/><rect x="307" y="54" width="4" height="4" opacity=".68"/>
    <rect x="314" y="25" width="4" height="4" opacity=".62"/><rect x="320" y="36" width="3" height="3" opacity=".52"/><rect x="315" y="49" width="4" height="4" opacity=".46"/><rect x="323" y="59" width="3" height="3" opacity=".35"/>
    <rect x="330" y="30" width="3" height="3" opacity=".30"/><rect x="334" y="46" width="2" height="2" opacity=".22"/>
  </g>

  <!-- Temporary wordmark: current cyan-outline direction. Final font remains a separate lock. -->
  <text x="10" y="91" fill="#ffffff" stroke="#10b9d7" stroke-width="1.8" paint-order="stroke fill" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-1.2">StageLight</text>
</svg>