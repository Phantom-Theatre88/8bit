<!doctype html><html lang="ja"><meta charset="utf-8"><title>Waveforms レイアウト検証</title><style>body{margin:12px;font:16px system-ui;background:#171e26;color:#eef2f6}iframe{display:block;border:1px solid #52606d;margin:8px 0 24px}h2{font-size:18px}pre{white-space:pre-wrap}</style><h1>波形ページ 画面サイズ別検証</h1><pre id="results">検証中</pre><script>
const sizes=[[1024,768],[1024,680],[1180,720],[1366,900],[768,1024],[820,1180]],results=[];
sizes.forEach(([width,height])=>{
 const title=document.createElement('h2');title.textContent=width+' × '+height;document.body.append(title);
 const frame=document.createElement('iframe');frame.width=width;frame.height=height;frame.title=title.textContent;frame.src='../Waveforms.html?layout-test='+width+'x'+height+'&v='+Date.now();
 frame.addEventListener('load',async()=>{
 const d=frame.contentDocument,w=frame.contentWindow,issues=[];
 const settle=()=>new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));
 await settle();
 for(const mode of ['single100','single3-100','single3-200','threephase','dimming','compare']){
 if(mode==='compare')d.querySelector('#compareHz').click();else d.querySelector('[data-mode="'+mode+'"]').click();
 await settle();
 if(d.documentElement.scrollWidth>width+1)issues.push(mode+': horizontal overflow');
 if(width>height){
 if(d.documentElement.scrollHeight>height+1)issues.push(mode+': page vertical overflow');
 d.querySelectorAll('.wave-intro,.wave-graph-card,.wave-side-card,.control-group,.lesson-bottom>.panel,.teacher-speech,.wave-legend').forEach(e=>{
 if(e.hidden)return;const r=e.getBoundingClientRect();
 if(e.scrollHeight>e.clientHeight+2||r.bottom>height+1)issues.push(mode+': '+(e.id||e.className)+' overflow');
 });
 }}
 d.querySelector('[data-mode="single100"]').click();d.querySelector('[data-position="90"]').click();
 results.push({width,height,pass:!issues.length,issues,peak:d.querySelector('#instantReadout').textContent,scrollWidth:d.documentElement.scrollWidth,scrollHeight:d.documentElement.scrollHeight});
 document.getElementById('results').textContent=JSON.stringify(results.sort((a,b)=>a.width-b.width||a.height-b.height),null,2);
 });document.body.append(frame);
});</script></html>
